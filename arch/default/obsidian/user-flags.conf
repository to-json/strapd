# Obsidian reads this file through the Arch package wrapper.
#
# It lives here rather than in config/ because Obsidian is opt-in: config/ is
# copied wholesale into /etc/skel/.config, so a file there would land in the
# home directory of every user, installed app or not.
# bin/strapd-install-obsidian places it.
-disable-gpu
--enable-wayland-ime
