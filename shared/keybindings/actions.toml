# ---------------------------------------------------------------------------
# layout
# ---------------------------------------------------------------------------

[[action]]
id = "layout.toggle_split"
category = "layout"
description = "Toggle window split direction"
key = "SUPER+CTRL+J"

  [action.niri]
  unsupported = true
  reason = "Scrolling-tiling model has no manual split-direction concept"

  [action.sway]
  dispatch = "layout toggle split"

  [action.mango]
  unsupported = true
  reason = "Mango switches whole named layouts with switch_layout; there is no per-container split direction to toggle"

[[action]]
id = "layout.pseudo_tile"
category = "layout"
description = "Toggle pseudo-tiling for focused window"
key = "SUPER+P"

  [action.niri]
  unsupported = true
  reason = "Pseudo-tiling (floating rendered within the tiled layout) is a Hyprland-specific window state; niri's scrolling-tiling model has no equivalent to toggle"

  [action.sway]
  unsupported = true
  reason = "Pseudo-tiling is a Hyprland window state; a sway window is either tiled or floating, with nothing in between to toggle"

  [action.mango]
  unsupported = true
  reason = "Pseudo-tiling is a Hyprland window state; a mango window is tiled, floating or fullscreen, with nothing in between to toggle"

[[action]]
id = "layout.resize_pixel_delta"
category = "layout"
description = "Resize focused window by a pixel amount"
key = "SUPER+CTRL+ALT+H"

  [action.niri]
  unsupported = true
  reason = "Niri has no arbitrary pixel-delta resize dispatch like Hyprland's resize({x,y,relative=true}); its column/window sizing dispatches are proportional/preset-based instead, and this scope isn't confident enough of their exact syntax to guess at it here"

  [action.sway]
  dispatch = "resize shrink width 100 px"

  [action.mango]
  dispatch = "resizewin,-100,0"

[[action]]
id = "layout.window_grouping"
category = "layout"
description = "Toggle window grouping (tabs)"
key = "SUPER+G"

  [action.niri]
  unsupported = true
  reason = "Hyprland window groups/tabs have no equivalent concept in niri's scrolling-tiling model"

  [action.sway]
  dispatch = "layout toggle split tabbed"

  [action.mango]
  unsupported = true
  reason = "Mango has no window grouping or tabbing; its scratchpad is a different feature with its own binding, not a group"

[[action]]
id = "layout.switch_focus_floating_tiling"
category = "layout"
description = "Switch input focus between floating and tiling windows"
key = "SUPER+CTRL+T"

  [action.niri]
  dispatch = "switch-focus-between-floating-and-tiling"

  [action.sway]
  dispatch = "focus mode_toggle"

  [action.mango]
  unsupported = true
  reason = "Mango's focus dispatchers walk whatever is on the current tag; none of them moves focus between the floating and tiled sets specifically"

[[action]]
id = "layout.toggle_overview"
category = "layout"
description = "Toggle the workspace overview"
key = "SUPER+O"

  [action.niri]
  dispatch = "toggle-overview"

  [action.sway]
  unsupported = true
  reason = "Sway has no built-in workspace overview; the equivalent comes from an external tool with its own binding rather than from a sway command"

  [action.mango]
  dispatch = "toggleoverview"

