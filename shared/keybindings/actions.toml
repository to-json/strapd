# ---------------------------------------------------------------------------
# workspace
# ---------------------------------------------------------------------------

# Workspaces 1-9 sit on the digit key of the same name; workspace 10 is the
# odd one out, on SUPER+0, because there is no "10" key. `repeat` substitutes
# {n} literally into `key` as well as into id/description/dispatch, so 10
# cannot come from the range; it would render a bind on a key named "10",
# which niri rejects outright (caught by test/acceptance.d). Spelling the
# tenth out as its own action keeps that divergence visible in the data
# instead of hiding it behind a key-mapping rule in the expander.

[[action]]
id = "workspace.focus.{n}"
category = "workspace"
description = "Switch to workspace {n}"
key = "SUPER+{n}"
repeat = { var = "n", range = [1, 9] }

  [action.niri]
  dispatch = "focus-workspace {n}"

  [action.sway]
  dispatch = "workspace number {n}"

  [action.mango]
  dispatch = "view,{n},0"

[[action]]
id = "workspace.focus.10"
category = "workspace"
description = "Switch to workspace 10"
key = "SUPER+0"

  [action.niri]
  dispatch = "focus-workspace 10"

  [action.sway]
  dispatch = "workspace number 10"

  [action.mango]
  unsupported = true
  reason = "Mango has nine tags and no tenth to reach; view and tag take 1-9"

[[action]]
id = "workspace.move_window.{n}"
category = "workspace"
description = "Move focused window to workspace {n}"
key = "SUPER+SHIFT+{n}"
repeat = { var = "n", range = [1, 9] }

  [action.niri]
  dispatch = "move-window-to-workspace {n}"

  [action.sway]
  dispatch = "move container to workspace number {n}"

  [action.mango]
  dispatch = "tag,{n},0"

[[action]]
id = "workspace.move_window.10"
category = "workspace"
description = "Move focused window to workspace 10"
key = "SUPER+SHIFT+0"

  [action.niri]
  dispatch = "move-window-to-workspace 10"

  [action.sway]
  dispatch = "move container to workspace number 10"

  [action.mango]
  unsupported = true
  reason = "Mango has nine tags and no tenth to reach; view and tag take 1-9"

[[action]]
id = "workspace.next"
category = "workspace"
description = "Focus next workspace"
key = "SUPER+ALT+J"

  [action.niri]
  dispatch = "focus-workspace-down"

  [action.sway]
  dispatch = "workspace next"

  [action.mango]
  dispatch = "viewtoright,0"

[[action]]
id = "workspace.previous"
category = "workspace"
description = "Focus previous workspace"
key = "SUPER+ALT+K"

  [action.niri]
  dispatch = "focus-workspace-up"

  [action.sway]
  dispatch = "workspace prev"

  [action.mango]
  dispatch = "viewtoleft,0"

[[action]]
id = "workspace.focus_monitor_left"
category = "workspace"
description = "Focus monitor to the left"
key = "SUPER+CTRL+H"

  [action.niri]
  dispatch = "focus-monitor-left"

  [action.sway]
  dispatch = "focus output left"

  [action.mango]
  dispatch = "focusmon,left"

[[action]]
id = "workspace.focus_monitor_right"
category = "workspace"
description = "Focus monitor to the right"
key = "SUPER+CTRL+L"

  [action.niri]
  dispatch = "focus-monitor-right"

  [action.sway]
  dispatch = "focus output right"

  [action.mango]
  dispatch = "focusmon,right"

[[action]]
id = "workspace.move_window_to_monitor_left"
category = "workspace"
description = "Move focused window to monitor on the left"
key = "SUPER+SHIFT+CTRL+H"

  [action.niri]
  dispatch = "move-window-to-monitor-left"

  [action.sway]
  dispatch = "move container to output left"

  [action.mango]
  dispatch = "tagmon,left"

[[action]]
id = "workspace.move_window_to_monitor_right"
category = "workspace"
description = "Move focused window to monitor on the right"
key = "SUPER+SHIFT+CTRL+L"

  [action.niri]
  dispatch = "move-window-to-monitor-right"

  [action.sway]
  dispatch = "move container to output right"

  [action.mango]
