# strapd default keybindings - source of truth.
#
# See keybindings/schema.md for field semantics and validation rules, and
# bin/strapd-keybindings-generate for how this file becomes a real
# compositor config (currently: niri only).
#
# A representative default set. Where an action has no clean equivalent on a
# backend, that backend's table says so with a real reason instead of guessing
# at syntax.
#
# Two content notes that apply across this whole file:
#
# - `apps.*` and several `utilities.*`/`media.*`/`session.*` actions spawn
#   `strapd-*` helper commands that don't exist yet (e.g.
#   "strapd-launch-terminal", "strapd-audio-output-volume"). This is a
#   deliberate forward-reference, not a mistake: strapd doesn't have its
#   default-app-resolution or media-control mechanism built yet (later
#   phases), and hardcoding a concrete binary (e.g. "alacritty") here would
#   silently bake in a specific choice this project hasn't made. Naming the
#   eventual helper now means this file won't need to change shape when that
#   phase lands - only the helper scripts need to start existing.
# - `key` values intentionally stick to SUPER/SHIFT/ALT/CTRL + a single
#   letter or digit, never XF86 media-key names, mouse buttons, arrow/named
#   keys, or switch: bindings - that's the only key shape the renderer's key
#   translation is tested against in this scope. Real hardware media keys
#   (XF86AudioRaiseVolume and friends) are a later concern; the `media`
#   category below covers the same intent with plain keyboard chords instead.

# ---------------------------------------------------------------------------
# window
# ---------------------------------------------------------------------------

[[action]]
id = "window.close"
category = "window"
description = "Close focused window"
key = "SUPER+W"

  [action.niri]
  dispatch = "close-window"

  [action.sway]
  dispatch = "kill"

  [action.mango]
  dispatch = "killclient"

[[action]]
id = "window.close_alt"
category = "window"
description = "Close focused window (alternate binding)"
key = "SUPER+Q"

  [action.niri]
  dispatch = "close-window"

  [action.sway]
  dispatch = "kill"

  [action.mango]
  dispatch = "killclient"

[[action]]
id = "window.fullscreen"
category = "window"
description = "Toggle fullscreen"
key = "SUPER+F"

  [action.niri]
  dispatch = "fullscreen-window"

  [action.sway]
  dispatch = "fullscreen toggle"

  [action.mango]
  dispatch = "togglefullscreen"

[[action]]
id = "window.maximize"
category = "window"
description = "Maximize column (full width)"
key = "SUPER+ALT+F"

  [action.niri]
  dispatch = "maximize-column"

  [action.sway]
  unsupported = true
  reason = "Maximizing a column is a niri concept; a sway window is either its share of the tree or fullscreen, and fullscreen is already bound by window.fullscreen"

  [action.mango]
  dispatch = "togglemaximizescreen"

[[action]]
id = "window.windowed_fullscreen"
category = "window"
description = "Tell the focused window it is fullscreen while leaving it in the layout"
key = "SUPER+CTRL+F"

  [action.niri]
  dispatch = "toggle-windowed-fullscreen"

  [action.sway]
  unsupported = true
  reason = "Sway has one fullscreen and it takes the whole output; there is no state that reports fullscreen to the client while the compositor keeps the window in the tree"

  [action.mango]
  dispatch = "togglefakefullscreen"

[[action]]
id = "window.pop"
category = "window"
description = "Pop the focused window out as a fixed floating window, or put it back"
key = "SUPER+SHIFT+O"

  [action.niri]
  dispatch = "spawn \"strapd-wm-window-pop\""

  [action.sway]
  dispatch = "exec strapd-wm-window-pop"

  [action.mango]
  dispatch = "spawn,strapd-wm-window-pop"

[[action]]
id = "window.toggle_floating"
category = "window"
description = "Toggle floating/tiling for focused window"
key = "SUPER+T"

  [action.niri]
  dispatch = "toggle-window-floating"

  [action.sway]
  dispatch = "floating toggle"

  [action.mango]
  dispatch = "togglefloating"

[[action]]
id = "window.focus_left"
category = "window"
description = "Focus column to the left"
key = "SUPER+H"

  [action.niri]
  dispatch = "focus-column-left"

  [action.sway]
  dispatch = "focus left"

  [action.mango]
  dispatch = "focusdir,left"

[[action]]
id = "window.focus_right"
category = "window"
description = "Focus column to the right"
key = "SUPER+L"

  [action.niri]
  dispatch = "focus-column-right"

  [action.sway]
  dispatch = "focus right"

  [action.mango]
  dispatch = "focusdir,right"

[[action]]
id = "window.focus_up"
category = "window"
description = "Focus window above"
key = "SUPER+K"

  [action.niri]
  dispatch = "focus-window-up"

  [action.sway]
  dispatch = "focus up"

  [action.mango]
