[[action]]
id = "utilities.monitor_scaling_toggle"
category = "utilities"
description = "Toggle monitor scaling"
key = "SUPER+CTRL+ALT+M"

  [action.niri]
  unsupported = true
  reason = "Monitor scaling is output configuration in niri (set per-output, e.g. via the output {} block or `niri msg output`), not a bind-level dispatch action - there is nothing to bind a toggle key to"

  [action.sway]
  unsupported = true
  reason = "Output scale is per-output config in sway (`output <name> scale <n>`, or the same over `swaymsg`), not a command with a toggle to bind"

  [action.mango]
  unsupported = true
  reason = "Output scale is set per-output in mango's own config file, not by a dispatcher there is a key to bind"
