# strapd's MangoWC defaults.
#
# Sourced by ~/.config/mango/config.conf, which sources its own files after
# this one, mango reads a config top to bottom and the last assignment wins,
# so anything set here can be overridden there. Nothing in this tree is yours
# to edit; a package update replaces it.
#
# One file, unlike the niri and sway defaults, which are split one file per
# subject. Mango resolves a relative `source=` against the process's working
# directory rather than against the file doing the sourcing, so a split package
# tree cannot source its own siblings, and absolute paths in here would be
# the installed path hardcoded three more times. A single sectioned file is
# also what mango's own /etc/mango/config.conf looks like.
#
# The session environment is not here either: it is the same for all three
# compositors, so it lives in default/uwsm/env.d/10-strapd, which uwsm
# sources before starting any of them.

# --- input -------------------------------------------------------------------
#
# The keyboard *layout* is not here. It comes from /etc/vconsole.conf via
# strapd-refresh-keyboard-layout, which writes a fragment
# ~/.config/mango/config.conf sources after this file.

# strapd's rates, considerably faster than mango's 25/600 default: held keys
# should repeat about as quickly as the terminal does.
repeat_rate=40
repeat_delay=250

numlockon=1

tap_to_click=1
# Two- and three-finger clicks are right- and middle-click, rather than click
# position deciding which button it was.
trackpad_click_method=clickfinger
trackpad_natural_scrolling=0
# Full-speed touchpad scrolling overshoots badly in most apps.
trackpad_scroll_factor=0.4

# Focus follows the mouse, and the pointer follows the keyboard focus, so the
# next click lands where the last keystroke went. Both are mango defaults;
# they are written down because they are strapd's choice on all three
# compositors, not because mango needs telling.
sloppyfocus=1
warpcursor=1

cursor_hide_on_keypress=1
cursor_size=24

# --- look and feel -----------------------------------------------------------
#
# The colors are Everforest's, spelled out rather than templated. Phase 6 adds
# a mango template target and this file becomes a .tpl; until it does,
# switching themes will not move them, and Everforest is the only palette v1
# ships anyway. Mango takes colors as 0xRRGGBBAA.

gappih=5
gappiv=5
gappoh=10
gappov=10

borderpx=2
focuscolor=0x7fbbb3ff
bordercolor=0x475258ff
urgentcolor=0xe67e80ff

# Square corners, matching the other two. Mango rounds by default.
border_radius=0

# What is behind the wallpaper. strapd-theme-bg-apply draws the current
# theme's image over this, so it shows through only before a theme has been
# applied or when a theme ships no background; it is the color niri and sway
# paint in that case too.
rootcolor=0x2d353bff

# Mango draws a differently-colored border for each state a window can be in.
# Left alone they are stock colors that have nothing to do with the theme, so
# they get Everforest's own.
maximizescreencolor=0xa7c080ff
scratchpadcolor=0xd699b6ff
globalcolor=0xdbbc7fff
overlaycolor=0x83c092ff

# --- window rules ------------------------------------------------------------
#
# Which windows float, which open full screen, and how big they come up.
#
# Hand-written per compositor rather than generated from one table the way the
# keybindings are. Niri, sway and mango disagree about what a window rule can
# say at all, and the disagreements are not roundable: where one of them
# cannot express a rule the other two do, this file says so instead of leaving
# a silent gap.
#
# Mango takes one `windowrule=` per line, as key:value pairs, and matches
# `appid` and `title` as regular expressions. It applies every rule that
# matches and the last one wins, so ~/.config/mango/windows.conf, read after
# this file, overrides anything set here.
#
# Translucency is the rule mango does not get. Niri and sway make every window
# very slightly transparent and hand full opacity back to video, images and
# colour work; mango has no per-window opacity, only the session-wide
# focused_opacity and unfocused_opacity, which cannot be handed back. An
# all-or-nothing translucency that also dims a video editor is worse than
# none, so mango's windows are opaque.

# Dialogs and single-purpose windows float rather than joining the tiling. The
# portal is every file picker, screen-share chooser and permission prompt on
# the system, whatever app asked for it.
windowrule=isfloating:1,appid:^xdg-desktop-portal-gtk$
windowrule=isfloating:1,appid:^(imv|mpv)$
windowrule=isfloating:1,appid:[Ll]ocalsend,width:1100,height:700

# Floating terminals: the size a TUI wants before it starts word-wrapping.
# `TUI.float` is the app-id strapd-tui-install gives an entry it marked as
# floating; `TUI.tile` deliberately gets no rule and tiles like anything else.
windowrule=isfloating:1,appid:^TUI\.float$,width:875,height:600
# What strapd-launch-floating-terminal-with-presentation runs an installer or an
# update in: a dialog wearing a terminal, and floating for the same reason.
windowrule=isfloating:1,appid:^org\.strapd\.terminal$,width:875,height:600

# Picture-in-picture: a small video that belongs out of the way, on top of
# whatever tag is showing, with nothing drawn around it. `isglobal` is mango's
# name for what sway calls sticky; niri has no equivalent and its file says so.
windowrule=isfloating:1,isglobal:1,isnoborder:1,width:600,height:338,title:[Pp]icture.?in.?[Pp]icture

# Games and game streaming: full screen from the start, and the screen stays
# awake while they have focus, which matters for a game being streamed to
# this machine rather than rendered on it, where nothing is asking the
# compositor to keep the display on.
windowrule=isfullscreen:1,idleinhibit_when_focus:1,appid:^(com\.moonlight_stream\.Moonlight|com\.libretro\.RetroArch)$

# Not here either: the "<app> is sharing your screen" window a browser puts up
# for the length of a screen share, which sway parks in its scratchpad. Mango's
# scratchpad marks a window rather than hiding it, one ruled into it still
# opens on screen, so there is nothing to park the indicator in.

# --- autostart ---------------------------------------------------------------
#
# Noctalia is the shell, and it is started below. Everything here runs after
# uwsm finalize, because until the session announces itself there is no
# systemd user environment for any of it to inherit.

# Hand WAYLAND_DISPLAY and friends to systemd and dbus, and tell uwsm the
# compositor is up. uwsm starts the compositor and then waits for the session
# to announce itself; without this line mango runs, never announces, and gets
# SIGTERMed. Hyprland needed no equivalent because it has native uwsm support.
# None of strapd's three compositors do.
exec-once=uwsm finalize

# First-run provisioning: no-ops on every boot after the first.
exec-once=strapd-provision-first-run

exec-once=strapd-powerprofiles-init

# The shell: bar, panels, OSDs. Started before the background is applied,
# because when it is running it is what draws the background.
exec-once=noctalia -d

# The current theme's background, handed to the shell if it came up, drawn
# with swaybg if it did not.
exec-once=sleep 1 && strapd-theme-bg-apply

# Automount removable media without a tray icon or a notification.
exec-once=udiskie --automount --no-notify --no-tray

# User hooks, after the session has settled rather than in the middle of it
# coming up.
exec-once=sleep 2 && strapd-hook post-boot
