# Window rules: which windows float, which open full screen, which stay fully
# opaque, and how big they come up.
#
# Hand-written per compositor rather than generated from one table the way the
# keybindings are. Niri, sway and mango disagree about what a window rule can
# say at all, and the disagreements are not roundable: where one of them
# cannot express a rule the other two do, the file says so instead of leaving
# a silent gap.
#
# Sway runs every `for_window` whose criteria match, in the order it read
# them, so the last command to set a property wins, and
# ~/.config/sway/windows.conf, which loads after this file, wins over all of
# it.

# A hair of translucency, so a window reads as a window on a desktop rather
# than as the whole screen. Rules below take it back wherever seeing through a
# window is a defect rather than an effect.
#
# Matched on title rather than app_id: an XWayland window has no app_id, and
# leaving every X11 app as the only opaque thing on the desktop would look
# like a bug in the theme.
for_window [title=".*"] opacity 0.985

# Anything whose pixels are the point: video, images, colour work, and the
# browser, whose subpixel text antialiasing is drawn for an opaque backdrop
# and fringes visibly without one.
for_window [app_id="^(chromium|imv|mpv|com\.obsproject\.Studio|org\.kde\.kdenlive|org\.gnome\.NautilusPreviewer)$"] opacity 1.0

# Dialogs and single-purpose windows float rather than joining the tiling. The
# portal is every file picker, screen-share chooser and permission prompt on
# the system, whatever app asked for it.
for_window [app_id="^xdg-desktop-portal-gtk$"] floating enable
for_window [app_id="^(imv|mpv)$"] floating enable
for_window [app_id="[Ll]ocalsend"] floating enable, resize set 1100 700, move position center

# Floating terminals: the size a TUI wants before it starts word-wrapping.
# `TUI.float` is the app-id strapd-tui-install gives an entry it marked as
# floating; `TUI.tile` deliberately gets no rule and tiles like anything else.
#
# The size is a request here, where it is settled under niri and mango. Sway
# leaves a floating window's opening size to the client, so this rule and the
# terminal's own configured size race: the same foot launched three times in
# one session came up at 875x600 twice and at foot's own size once. The line
# stays, it wins more often than not and nothing breaks when it loses, but
# a floating terminal whose size has to be exact is the terminal's setting to
# make, not this one's.
for_window [app_id="^TUI\.float$"] floating enable, resize set 875 600, move position center

# What strapd-launch-floating-terminal-with-presentation runs an installer or an
# update in: a dialog wearing a terminal, and floating for the same reason.
for_window [app_id="^org\.strapd\.terminal$"] floating enable, resize set 875 600, move position center

# Picture-in-picture: a small video that belongs out of the way, pinned across
# workspaces, with nothing drawn around it.
#
# Where it lands is the part sway cannot say: `move position` takes pixel
# coordinates or `center`, with no corner to anchor to, so a rule that put it
# bottom-right on this monitor would put it off the edge of the next one. Niri
# anchors floating windows to a corner and its file does; sway leaves it
# wherever it opened, and the user drags it once.
for_window [title="[Pp]icture.?in.?[Pp]icture"] floating enable, sticky enable, border none, opacity 1.0, resize set 600 338

# Games and game streaming: full screen from the start, no translucency over
# the top of them, and the screen stays awake for as long as they are the
# fullscreen window, which matters for a game being streamed to this machine
# rather than rendered on it, where nothing is asking the compositor to keep
# the display on.
for_window [app_id="^(com\.moonlight_stream\.Moonlight|com\.libretro\.RetroArch)$"] fullscreen enable, inhibit_idle fullscreen, opacity 1.0

# The "<app> is sharing your screen" window a browser puts up for the duration
# of a screen share. It is a notification wearing a window, and it is on top of
# whatever is actually being shared; the scratchpad is where sway keeps a
# window that exists but should not be on screen.
for_window [title=".*is sharing.*"] move scratchpad
