# Input. The keyboard *layout* is not here; it comes from
# /etc/vconsole.conf via strapd-refresh-keyboard-layout, which writes a
# fragment ~/.config/sway/config includes after this file. Sway merges input
# blocks by identifier, so that fragment's `input type:keyboard` adds to this
# one rather than replacing it.

input type:keyboard {
    # strapd's rates, considerably faster than the defaults: held keys
    # should repeat about as quickly as the terminal does.
    repeat_delay 250
    repeat_rate 40

    xkb_numlock enabled
}

input type:touchpad {
    tap enabled
    # Two- and three-finger clicks are right- and middle-click, rather than
    # click position deciding which button it was.
    click_method clickfinger
    natural_scroll disabled
    # Full-speed touchpad scrolling overshoots badly in most apps.
    scroll_factor 0.4
}

focus_follows_mouse yes

# Keep the pointer with the keyboard focus, so the next click lands where the
# last keystroke went.
mouse_warping container

seat * hide_cursor when-typing enable
