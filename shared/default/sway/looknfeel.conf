# Look and feel.
#
# The colors below are Everforest's, spelled out rather than templated. Phase 6
# adds a sway template target and this file becomes a .tpl; until it does,
# switching themes will not move them, and Everforest is the only palette v1
# ships anyway.

gaps inner 5
gaps outer 5

# A border and no titlebar. Sway puts a titlebar on every window by default,
# and with a keyboard-driven compositor that is pure lost height, the same
# call `prefer-no-csd` makes for client-side decorations under niri.
default_border pixel 2
default_floating_border pixel 2

#                       border    background text      indicator child_border
client.focused          #7fbbb3   #7fbbb3    #2d353b   #7fbbb3   #7fbbb3
client.focused_inactive #475258   #475258    #d3c6aa   #475258   #475258
client.unfocused        #475258   #475258    #d3c6aa   #475258   #475258
client.urgent           #e67e80   #e67e80    #2d353b   #e67e80   #e67e80

font pango:JetBrainsMono Nerd Font 10

# Sway leaves its own gray behind the windows. strapd-theme-bg-apply draws the
# current theme's image over this, so what it sets is what shows through before
# a theme has been applied or when a theme ships no background, and sway
# starts a swaybg of its own for this line, which is why bg-apply tracks the
# one it started rather than killing every swaybg it finds.
output * bg #2d353b solid_color

seat * xcursor_theme default 24
