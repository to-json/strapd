# Your monitors. Sway picks a sensible mode and arrangement on its own, so this
# file is empty until you disagree with it.
#
# `swaymsg -t get_outputs` prints the names and available modes of what is
# plugged in right now.
#
# output eDP-1 scale 1.5 position 0 0
# output DP-1 mode 3840x2160@59.997Hz scale 2 position 2560 0
#
# Fractional scales are sharp for apps that speak the fractional-scale-v1
# protocol, which sway offers to every client: GTK4, Qt6, and recent Firefox
# and Chromium/Electron all render pixel-perfect at 1.5. Anything older (GTK3,
# dated Electron) falls back to rendering at the next integer and being
# downsampled, which softens text. If those apps matter to you, keep to a
# whole-number scale and shrink fonts instead (terminal font size, GTK/Qt
# font settings).
#
# An app that stays blurry at an integer scale is running through XWayland,
# which sway stretches up from 1x. The session already pushes Firefox,
# Chromium/Electron and Qt onto native Wayland (default/uwsm/env.d/10-strapd
# in the strapd tree); `swaymsg -t get_tree | grep -i xwayland` names the
# holdouts.
#
# A monitor you want ignored entirely:
#
# output HDMI-A-1 disable
