# Your keybindings.
#
# strapd's bindings do not live here. They are one TOML table rendered into
# every compositor strapd ships, so that changing a binding changes it for
# all three:
#
#   cp /usr/share/strapd/keybindings/actions.toml ~/.config/strapd/keybindings.toml
#   $EDITOR ~/.config/strapd/keybindings.toml
#   strapd refresh keybindings
#
# That is the file to edit for anything you also want in niri or mango, and
# for anything you want to appear in the keybinding cheatsheet.
#
# This file is for the sway-only ones. It loads after the generated table, so
# a bind here also replaces one from the table. $mod is Mod4, set by that
# generated file.
#
# bindsym $mod+Shift+r exec alacritty -e ssh your-server
#
# A sway-specific action with no equivalent elsewhere:
#
# bindsym $mod+Ctrl+s layout stacking
