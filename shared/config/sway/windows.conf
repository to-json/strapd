# Your window rules. strapd's are in
# /usr/share/strapd/default/sway/windows.conf.
#
# Sway runs every `for_window` whose criteria match, in the order it read
# them, so a rule here runs after strapd's and is the one that sticks.
#
# Float a chat app, always:
#
# for_window [app_id="^Slack$"] floating enable
#
# Undo strapd's translucency and make every window opaque:
#
# for_window [title=".*"] opacity 1.0
#
# Send an app to a workspace whenever it opens; a rule sway has that the
# other two express differently, if at all:
#
# assign [app_id="^Spotify$"] workspace 9
