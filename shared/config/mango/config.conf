# MangoWC configuration. https://github.com/DreamMaoMao/mango/wiki/
#
# strapd loads in three passes, and mango reads a config top to bottom, the
# last assignment wins:
#
#   1. strapd's defaults, out of the package.
#   2. What was generated for this machine: your keyboard layout and the
#      keybinding table.
#   3. Your own files, below. They load last, so they win.
#
# Everything past the first source is yours to edit. The first one is not:
# point it somewhere else and package updates stop reaching your session.

source=/usr/share/strapd/default/mango/strapd.conf

# Generated, do not edit these two, they are overwritten. The keyboard
# layout comes from /etc/vconsole.conf (change it with localectl); the binds
# come from the keybinding table, which is
# /usr/share/strapd/keybindings/actions.toml until you copy it to
# ~/.config/strapd/keybindings.toml and make it yours. Both are rewritten
# at every login, and on demand with `strapd refresh keyboard layout` and
# `strapd refresh keybindings`.
source=~/.local/state/strapd/keyboard/mango.conf
source=~/.local/state/strapd/keybindings/mango.conf

# Yours. Spelled out from $HOME rather than as bare file names: mango resolves
# a relative source against the working directory the session was started
# from, not against this file.
source=~/.config/mango/monitors.conf
source=~/.config/mango/input.conf
source=~/.config/mango/bindings.conf
source=~/.config/mango/looknfeel.conf
source=~/.config/mango/windows.conf
source=~/.config/mango/autostart.conf
