# Your window rules. strapd's are in the window rules section of
# /usr/share/strapd/default/mango/strapd.conf.
#
# Mango takes one `windowrule=` per line, as key:value pairs, matching `appid`
# and `title` as regular expressions. Rules here are read after strapd's.
#
# Float a chat app, always:
#
# windowrule=isfloating:1,appid:^Slack$
#
# Keep a window on top of whatever tag is showing, the way strapd pins
# picture-in-picture:
#
# windowrule=isglobal:1,appid:^Slack$
