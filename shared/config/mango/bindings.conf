# Your keybindings.
#
# strapd's bindings do not live here. They are one TOML table rendered into
# every compositor strapd ships, so that changing a binding changes it for
# all three:
#
#   cp /usr/share/strapd/keybindings/actions.toml ~/.config/strapd/keybindings.toml
#   $EDITOR ~/.config/strapd/keybindings.toml
#   strapd refresh keybindings
#
# That is the file to edit for anything you also want in niri or sway, and for
# anything you want to appear in the keybinding cheatsheet.
#
# This file is for the mango-only ones. It loads after the generated table, so
# a bind here also replaces one from the table.
#
# bind=SUPER+SHIFT,r,spawn,alacritty -e ssh your-server
#
# A mango-specific action with no equivalent elsewhere:
#
# bind=SUPER,z,toggle_scratchpad
